services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: steamcents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: steamcents
    # loopback only. the sweep runs on the host under systemd, and nothing
    # outside the box should ever reach postgres.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamcents -d steamcents"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://steamcents:${POSTGRES_PASSWORD:?}@db:5432/steamcents
      API_ORIGINS: ${API_ORIGINS:-https://steamcents.com,https://www.steamcents.com}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
